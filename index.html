<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Szín Elemző</title>
  <meta name="description" content="Írj be egy nevet, és nézd meg a színek eloszlását.">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script>
    try {
      var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wash" id="wash" aria-hidden="true"></div>

  <main class="card">
    <button type="button" id="themeBtn" class="icon-btn" aria-label="Téma váltása">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>

    <h1>Szín Elemző</h1>
    <p class="lead">Írj be egy nevet, és nézd meg a színek eloszlását.</p>

    <form id="form" autocomplete="off">
      <label class="sr" for="nameInput">Név</label>
      <input type="text" id="nameInput" placeholder="Add meg a nevet" enterkeyhint="done" autocapitalize="words" spellcheck="false">
    </form>

    <p id="hint" class="hint">Kezdj el gépelni…</p>

    <section id="results" aria-live="polite" hidden>
      <div id="name" class="name"></div>
      <p id="summary" class="summary"></p>
      <div id="strip" class="strip" aria-hidden="true"></div>
      <ul id="rows" class="rows"></ul>
      <div id="warning" class="warning" hidden></div>
      <button type="button" id="shareBtn" class="share">Megosztás képként</button>
    </section>
  </main>

  <script src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
